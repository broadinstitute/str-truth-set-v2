name: build isoseq pbmm2 image

# Builds the Iso-Seq alignment image (pbmm2 26.1.0 on the long-reads toolchain) and pushes it to
# Docker Hub as weisburd/long-reads:pbmm2_26.1.0. Manual trigger only (Actions tab -> Run workflow,
# or `gh workflow run build_isoseq_image.yml --ref <branch>`). The pushed image digest is written to
# align_pacbio/docker_isoseq/sha256.txt and uploaded as an artifact.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME - Docker Hub account name
#   DOCKERHUB_TOKEN    - Docker Hub access token (or password) with push scope on weisburd/long-reads

on:
  workflow_dispatch:

jobs:
  build:
    name: build weisburd/long-reads:pbmm2_26.1.0
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        working-directory: align_pacbio/docker_isoseq
        run: |
          set -euo pipefail
          TAG=weisburd/long-reads:pbmm2_26.1.0
          docker build -t "$TAG" -f Dockerfile .
          docker push "$TAG" | tee push.log
          grep -E 'digest: sha256:' push.log \
            | sed -E 's/.*(sha256:[0-9a-f]+).*/\1/' \
            | sed 's|^|weisburd/long-reads@|' > sha256.txt
          echo "Pushed digest:"
          cat sha256.txt

      - name: Upload sha256 digest
        uses: actions/upload-artifact@v4
        with:
          name: sha256
          path: align_pacbio/docker_isoseq/sha256.txt
