name: build dipcall-pipeline image

# Builds weisburd/dipcall-pipeline (dipcall_pipeline/docker/Dockerfile) and pushes it to Docker Hub. The
# Dockerfile is self-contained (no COPY from the repo), so it builds from its own directory. The pushed image
# digest is written to dipcall_pipeline/docker/sha256.txt and uploaded as an artifact; update the
# dipcall-pipeline@sha256 references in the *.py files from that digest. Manual trigger only
# (Actions tab -> Run workflow, or `gh workflow run build_dipcall_pipeline_image.yml --ref <branch>`).
#
# Required repository secrets:
#   DOCKERHUB_USERNAME - Docker Hub account name
#   DOCKERHUB_TOKEN    - Docker Hub access token (or password) with push scope on weisburd/dipcall-pipeline

on:
  workflow_dispatch:

jobs:
  build:
    name: build weisburd/dipcall-pipeline
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        working-directory: dipcall_pipeline/docker
        run: |
          set -euo pipefail
          TAG=weisburd/dipcall-pipeline:latest
          docker build -t "$TAG" -f Dockerfile .
          docker push "$TAG" | tee push.log
          DIGEST=$(grep -E 'digest: sha256:' push.log | sed -E 's/.*(sha256:[0-9a-f]+).*/\1/')
          test -n "$DIGEST"
          echo "weisburd/dipcall-pipeline@${DIGEST}" > sha256.txt
          echo "Pushed digest:"
          cat sha256.txt

      - name: Upload sha256 digest
        uses: actions/upload-artifact@v4
        with:
          name: sha256
          path: dipcall_pipeline/docker/sha256.txt
