name: build atarva image

# Builds weisburd/atarva and pushes it to Docker Hub. The Dockerfile lives in the str-truth-set submodule
# (tool_comparison/hail_batch_pipelines/docker/atarva) and is self-contained (it installs ATaRVa from PyPI, builds
# htslib/samtools, and pip-installs str-analysis), so the checkout pulls submodules and the build context is just that
# directory. The pushed image digest is written to docker/atarva/sha256.txt and uploaded as an artifact; update the
# DOCKER_IMAGE reference in atarva_pipeline.py from that digest. Manual trigger only
# (Actions tab -> Run workflow, or `gh workflow run build_atarva_image.yml --ref <branch>`).
#
# Required repository secrets:
#   DOCKERHUB_USERNAME - Docker Hub account name
#   DOCKERHUB_TOKEN    - Docker Hub access token (or password) with push scope on weisburd/atarva

on:
  workflow_dispatch:

jobs:
  build:
    name: build weisburd/atarva
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        run: |
          set -euo pipefail
          TAG=weisburd/atarva:0.7.1
          CONTEXT=str-truth-set/tool_comparison/hail_batch_pipelines/docker/atarva
          docker build -t "$TAG" "$CONTEXT"
          docker push "$TAG" | tee push.log
          DIGEST=$(grep -E 'digest: sha256:' push.log | sed -E 's/.*(sha256:[0-9a-f]+).*/\1/')
          test -n "$DIGEST"
          echo "weisburd/atarva@${DIGEST}" > "$CONTEXT/sha256.txt"
          echo "Pushed digest:"
          cat "$CONTEXT/sha256.txt"

      - name: Upload sha256 digest
        uses: actions/upload-artifact@v4
        with:
          name: sha256
          path: str-truth-set/tool_comparison/hail_batch_pipelines/docker/atarva/sha256.txt
