name: build filter-vcfs image

# Builds weisburd/filter-vcfs and pushes it to Docker Hub. The image is built from the repo root (the
# Dockerfile COPYs the str-truth-set submodule and filter_vcfs/scripts), so the checkout pulls submodules.
# The pushed image digest is written to filter_vcfs/docker/sha256.txt and uploaded as an artifact; update the
# FILTER_VCFS_DOCKER_IMAGE references in the *.py files from that digest. Manual trigger only
# (Actions tab -> Run workflow, or `gh workflow run build_filter_vcfs_image.yml --ref <branch>`).
#
# Required repository secrets:
#   DOCKERHUB_USERNAME - Docker Hub account name
#   DOCKERHUB_TOKEN    - Docker Hub access token (or password) with push scope on weisburd/filter-vcfs

on:
  workflow_dispatch:

jobs:
  build:
    name: build weisburd/filter-vcfs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        run: |
          set -euo pipefail
          TAG=weisburd/filter-vcfs:latest
          docker build -t "$TAG" -f filter_vcfs/docker/Dockerfile .
          docker push "$TAG" | tee push.log
          DIGEST=$(grep -E 'digest: sha256:' push.log | sed -E 's/.*(sha256:[0-9a-f]+).*/\1/')
          test -n "$DIGEST"
          echo "weisburd/filter-vcfs@${DIGEST}" > filter_vcfs/docker/sha256.txt
          echo "Pushed digest:"
          cat filter_vcfs/docker/sha256.txt

      - name: Upload sha256 digest
        uses: actions/upload-artifact@v4
        with:
          name: sha256
          path: filter_vcfs/docker/sha256.txt
