name: build run-tools image

# Builds weisburd/run-tools and pushes it to Docker Hub. The image is built from the repo root (the
# Dockerfile COPYs run_tools/convert_truth_set_to_variant_catalogs.py), so the checkout pulls submodules
# for consistency with the other image builds. The pushed image digest is written to
# run_tools/docker/sha256.txt and uploaded as an artifact; update the RUN_TOOLS_DOCKER_IMAGE reference in
# run_tools/*.py from that digest. Manual trigger only (Actions tab -> Run workflow, or
# `gh workflow run build_run_tools_image.yml --ref <branch>`).
#
# Required repository secrets:
#   DOCKERHUB_USERNAME - Docker Hub account name
#   DOCKERHUB_TOKEN    - Docker Hub access token (or password) with push scope on weisburd/run-tools

on:
  workflow_dispatch:

jobs:
  build:
    name: build weisburd/run-tools
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        run: |
          set -euo pipefail
          TAG=weisburd/run-tools:latest
          docker build -t "$TAG" -f run_tools/docker/Dockerfile .
          docker push "$TAG" | tee push.log
          DIGEST=$(grep -E 'digest: sha256:' push.log | sed -E 's/.*(sha256:[0-9a-f]+).*/\1/')
          test -n "$DIGEST"
          echo "weisburd/run-tools@${DIGEST}" > run_tools/docker/sha256.txt
          echo "Pushed digest:"
          cat run_tools/docker/sha256.txt

      - name: Upload sha256 digest
        uses: actions/upload-artifact@v4
        with:
          name: sha256
          path: run_tools/docker/sha256.txt
