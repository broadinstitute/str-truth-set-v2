name: build long-reads image

# Builds the base weisburd/long-reads image (align_pacbio/docker/Dockerfile) and pushes it to Docker Hub.
# The Dockerfile is self-contained (no COPY from the repo), so it builds from its own directory. (The
# pbmm2 Iso-Seq variant weisburd/long-reads:pbmm2_26.1.0 is built separately by build_isoseq_image.yml.)
# The pushed image digest is written to align_pacbio/docker/sha256.txt and uploaded as an artifact; update
# the long-reads@sha256 references in the *.py files from that digest. Manual trigger only
# (Actions tab -> Run workflow, or `gh workflow run build_long_reads_image.yml --ref <branch>`).
#
# Required repository secrets:
#   DOCKERHUB_USERNAME - Docker Hub account name
#   DOCKERHUB_TOKEN    - Docker Hub access token (or password) with push scope on weisburd/long-reads

on:
  workflow_dispatch:

jobs:
  build:
    name: build weisburd/long-reads
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        working-directory: align_pacbio/docker
        run: |
          set -euo pipefail
          TAG=weisburd/long-reads:latest
          docker build -t "$TAG" -f Dockerfile .
          docker push "$TAG" | tee push.log
          DIGEST=$(grep -E 'digest: sha256:' push.log | sed -E 's/.*(sha256:[0-9a-f]+).*/\1/')
          test -n "$DIGEST"
          echo "weisburd/long-reads@${DIGEST}" > sha256.txt
          echo "Pushed digest:"
          cat sha256.txt

      - name: Upload sha256 digest
        uses: actions/upload-artifact@v4
        with:
          name: sha256
          path: align_pacbio/docker/sha256.txt
